<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'">
  <title>Nanto bridge close fixture</title>
</head>
<body>
  <main>Nanto bridge close fixture</main>
  <script type="module">
    import { NantoClient } from "/nanto-core.js";
    import { createApp, manifest } from "/nanto-app.js";

    const transport = {
      post(message) {
        window.chrome.webview.postMessage(JSON.parse(message));
      },
      subscribe(listener) {
        const receive = event => listener(JSON.stringify(event.data));
        window.chrome.webview.addEventListener("message", receive);
        return () => window.chrome.webview.removeEventListener("message", receive);
      },
    };
    const client = new NantoClient(transport);
    try {
      await client.connect(manifest);
      const projects = createApp(client).projects;
      void projects.wait().catch(() => undefined);
      let activeWaitCount = 0;
      for (let attempt = 0; attempt < 100 && activeWaitCount === 0; attempt++) {
        activeWaitCount = await projects.getActiveWaitCount();
        if (activeWaitCount === 0) {
          await new Promise(resolve => setTimeout(resolve, 10));
        }
      }

      if (activeWaitCount !== 1) {
        throw new Error("native-wait-not-started");
      }

      window.chrome.webview.postMessage("nanto:test:bridge:close:started");
      window.chrome.webview.postMessage("nanto:ready:v1");
    } catch (error) {
      const name = error instanceof Error ? error.message : "unknown";
      window.chrome.webview.postMessage(`nanto:test:bridge:error:close:${name}`);
    }
  </script>
</body>
</html>
